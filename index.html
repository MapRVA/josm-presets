<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>MapRVA JOSM Preset</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');

                * { margin: 0; padding: 0; box-sizing: border-box; }

                    body {
                          font-family: 'DM Sans', system-ui, sans-serif;
                                min-height: 100vh;
                                      display: flex;
                                            align-items: center;
                                                  justify-content: center;
                                                        background: #f5f5f0;
                                                              color: #1a1a1a;
                                                                    padding: 2rem;
                                                                        }

                                                                            main {
                                                                                  max-width: 540px;
                                                                                        width: 100%;
                                                                                            }

                                                                                                h1 {
                                                                                                      font-size: 2rem;
                                                                                                            font-weight: 700;
                                                                                                                  letter-spacing: -0.02em;
                                                                                                                        margin-bottom: 0.5rem;
                                                                                                                            }

                                                                                                                                p.subtitle {
                                                                                                                                      color: #666;
                                                                                                                                            margin-bottom: 2rem;
                                                                                                                                                  line-height: 1.5;
                                                                                                                                                      }

                                                                                                                                                          .preset-url {
                                                                                                                                                                background: #fff;
                                                                                                                                                                      border: 1px solid #ddd;
                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                  padding: 1rem 1.25rem;
                                                                                                                                                                                        display: flex;
                                                                                                                                                                                              align-items: center;
                                                                                                                                                                                                    justify-content: space-between;
                                                                                                                                                                                                          gap: 1rem;
                                                                                                                                                                                                                transition: border-color 0.15s;
                                                                                                                                                                                                                    }

                                                                                                                                                                                                                        .preset-url:hover { border-color: #999; }

                                                                                                                                                                                                                            .preset-url code {
                                                                                                                                                                                                                                  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
                                                                                                                                                                                                                                        font-size: 0.95rem;
                                                                                                                                                                                                                                              color: #2d6a4f;
                                                                                                                                                                                                                                                    word-break: break-all;
                                                                                                                                                                                                                                                          user-select: all;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  .copy-btn {
                                                                                                                                                                                                                                                                        background: #1a1a1a;
                                                                                                                                                                                                                                                                              color: #fff;
                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                          border-radius: 6px;
                                                                                                                                                                                                                                                                                                padding: 0.5rem 1rem;
                                                                                                                                                                                                                                                                                                      font-family: inherit;
                                                                                                                                                                                                                                                                                                            font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                  font-weight: 500;
                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                              white-space: nowrap;
                                                                                                                                                                                                                                                                                                                                    transition: background 0.15s;
                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                            .copy-btn:hover { background: #333; }
                                                                                                                                                                                                                                                                                                                                                .copy-btn:active { background: #555; }

                                                                                                                                                                                                                                                                                                                                                    .instructions {
                                                                                                                                                                                                                                                                                                                                                          margin-top: 1.5rem;
                                                                                                                                                                                                                                                                                                                                                                font-size: 0.85rem;
                                                                                                                                                                                                                                                                                                                                                                      color: #888;
                                                                                                                                                                                                                                                                                                                                                                            line-height: 1.6;
                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                                                                                                                                                  </head>
                                                                                                                                                                                                                                                                                                                                                                                  <body>
                                                                                                                                                                                                                                                                                                                                                                                    <main>
                                                                                                                                                                                                                                                                                                                                                                                        <h1>MapRVA JOSM Preset</h1>
                                                                                                                                                                                                                                                                                                                                                                                            <p class="subtitle">Add this preset URL in JOSM under<br>
                                                                                                                                                                                                                                                                                                                                                                                                  <strong>Preferences → Tagging Presets</strong>
                                                                                                                                                                                                                                                                                                                                                                                                Hit the plus sign, and paste the URL in.</p>

                                                                                                                                                                                                                                                                                                                                                                                                      <div class="preset-url">
                                                                                                                                                                                                                                                                                                                                                                                                            <code id="url">https://josm.maprva.org/preset.xml</code>
                                                                                                                                                                                                                                                                                                                                                                                                                  <button class="copy-btn" onclick="copyUrl()">Copy</button>
                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                          <p class="instructions">
                                                                                                                                                                                                                                                                                                                                                                                                                                Click the URL to select it, or hit <strong>Copy</strong> to send it to your clipboard.
                                                                                                                                                                                                                                                                                                                                                                                                                                    </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                      </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                            function copyUrl() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  const url = document.getElementById('url').textContent;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        navigator.clipboard.writeText(url).then(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                const btn = document.querySelector('.copy-btn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        btn.textContent = 'Copied!';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setTimeout(() => btn.textContent = 'Copy', 1500);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
